<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gallery | Sunrise Villa, Lebong, Darjeeling</title>
  <meta name="description" content="A look inside Sunrise Villa — rooms, the round signboard at Golai Bazar and the night lights of Lebong, Darjeeling.">
  <meta name="theme-color" content="#0c1c16">
  <link rel="icon" href="/assets/images/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/style.css?v=5">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  {{HEADER}}

  <main id="main">
    <section class="page-hero page-hero-dark">
      <div class="container page-hero-inner">
        <p class="eyebrow eyebrow-light"><span class="eyebrow-dot"></span> Take a look</p>
        <h1>Life at <em>Sunrise Villa.</em></h1>
        <p>Real rooms, real corners and the view you will wake up to. Tap any photo to see it larger.</p>
      </div>
    </section>

    <section class="section gallery-section">
      <div class="container">
        <div class="gallery-grid">
          <button class="gallery-item" type="button" data-lightbox data-src="/assets/images/room-premier.jpg" data-caption="Premier Double room">
            <img src="/assets/images/room-premier.jpg" alt="Premier Double room at Sunrise Villa" width="1086" height="1448" loading="lazy">
            <span>Premier Double</span>
          </button>
          <button class="gallery-item" type="button" data-lightbox data-src="/assets/images/room-deluxe.jpg" data-caption="Deluxe Double room">
            <img src="/assets/images/room-deluxe.jpg" alt="Deluxe Double room with a red patterned bedspread" width="1600" height="728" loading="lazy">
            <span>Deluxe Double</span>
          </button>
          <button class="gallery-item" type="button" data-lightbox data-src="/assets/images/signboard.jpg" data-caption="Our round signboard at Golai Bazar">
            <img src="/assets/images/signboard.jpg" alt="Sunrise Villa signboard glowing at night" width="900" height="900" loading="lazy">
            <span>Our little sign</span>
          </button>
          <button class="gallery-item" type="button" data-lightbox data-src="/assets/images/hero-night.jpg" data-caption="The lights of Lebong at night">
            <img src="/assets/images/hero-night.jpg" alt="Night view over Lebong and Darjeeling" width="728" height="1600" loading="lazy">
            <span>Lebong at night</span>
          </button>
          <button class="gallery-item" type="button" data-lightbox data-src="/assets/images/room-family.jpg" data-caption="Family Room">
            <img src="/assets/images/room-family.jpg" alt="Family Room with two beds at Sunrise Villa" width="960" height="1280" loading="lazy">
            <span>Family Room</span>
          </button>
          <button class="gallery-item" type="button" data-lightbox data-src="/assets/images/room-cozy.jpg" data-caption="Cozy Double room">
            <img src="/assets/images/room-cozy.jpg" alt="Cozy Double room in warm light" width="1280" height="960" loading="lazy">
            <span>Cozy Double</span>
          </button>
          <button class="gallery-item" type="button" data-lightbox data-src="/assets/images/exterior-sign.jpg" data-caption="Finding us is easy — look for the round sign">
            <img src="/assets/images/exterior-sign.jpg" alt="The illuminated Sunrise Villa sign outside the homestay" width="1280" height="1280" loading="lazy">
            <span>Find the glow</span>
          </button>
          <button class="gallery-item" type="button" data-lightbox data-src="/assets/images/valley-view.jpg" data-caption="The Lebong valley from Sunrise Villa">
            <img src="/assets/images/valley-view.jpg" alt="View over the green Lebong valley from Sunrise Villa" width="1600" height="1200" loading="lazy">
            <span>Lebong valley</span>
          </button>
          <button class="gallery-item" type="button" data-lightbox data-src="/assets/images/sunroom.jpg" data-caption="Sunlit corner with fresh sunflowers">
            <img src="/assets/images/sunroom.jpg" alt="Bright sunroom corner with sunflowers in a vase" width="1600" height="1200" loading="lazy">
            <span>Sunrise corner</span>
          </button>
          <button class="gallery-item" type="button" data-lightbox data-src="/assets/images/veranda-lounge.jpg" data-caption="Evening lounge under fairy lights">
            <img src="/assets/images/veranda-lounge.jpg" alt="Veranda lounge seating with warm fairy lights in the evening" width="1600" height="1200" loading="lazy">
            <span>Evening lounge</span>
          </button>
          <a class="gallery-cta" href="/book.html">
            <img src="/assets/images/logo.svg" alt="" width="440" height="440" loading="lazy">
            <strong>Your room is waiting</strong>
            <span>Book your stay <span aria-hidden="true">→</span></span>
          </a>
        </div>
      </div>
    </section>
  </main>

  {{FOOTER}}
</body>
</html>
